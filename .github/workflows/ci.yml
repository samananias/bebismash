name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.6.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unit and edge tests
        run: pnpm test:unit

      - name: Isolated local D1 database test
        run: pnpm db:test

      - name: Infrastructure configuration check
        run: pnpm infra:check

      - name: Prepare assets
        run: pnpm assets:prepare

      - name: Build production bundle
        run: pnpm build

      - name: Size check
        run: pnpm size:check

      - name: Install Playwright browsers and dependencies
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Worker integration tests
        run: pnpm test:workers

      - name: End-to-end browser tests
        run: pnpm test:e2e

      - name: Upload production bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: success()
        with:
          name: pages-dist
          path: dist
          retention-days: 3

      - name: Upload test results on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
